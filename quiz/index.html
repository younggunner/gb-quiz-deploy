<!-- One layout (Greg, 2026-11-20): the Variant-B layout test was killed and there is no video on the quiz.
     Layout A is the only layout; ?qv= no longer does anything. This script still mints gb_uid for the
     attribution script below and still reports quiz_variant "a", so reports keyed on it keep one stable value. -->
<script>
(function () {
  function uuidv4() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, function (c) {
      return (c ^ (crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4)).toString(16);
    });
  }
  var uid;
  try {
    uid = localStorage.getItem('gb_uid');
    if (!uid) { uid = uuidv4(); localStorage.setItem('gb_uid', uid); }
  } catch (e) { uid = uuidv4(); }
  window.__gbUid = uid;
  document.documentElement.dataset.variant = 'a';
  window.__quizVariant = 'a';
  window.dataLayer = window.dataLayer || [];
  window.dataLayer.push({ event: 'quiz_variant_assigned', quiz_variant: 'a' });
})();
</script>

<!-- Attribution script. ONE copy. Consumes window.__gbUid (minted above). Writes hidden onto every remaining widget. -->
<script>
(function () {
  function readCookie(name) {
    var m = document.cookie.match('(^|;)\\s*' + name + '=([^;]+)');
    return m ? decodeURIComponent(m[2]) : '';
  }
  var gb_uid = window.__gbUid;
  if (!gb_uid) {
    function uuidv4() {
      if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
      return ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, function(c){
        return (c ^ (crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c/4)).toString(16);
      });
    }
    try {
      gb_uid = localStorage.getItem('gb_uid');
      if (!gb_uid) { gb_uid = uuidv4(); localStorage.setItem('gb_uid', gb_uid); }
    } catch (e) { gb_uid = uuidv4(); }
  }

  function readCookie2(name) {
    var m = document.cookie.match('(^|;)\\s*' + name + '=([^;]+)');
    return m ? decodeURIComponent(m[2]) : '';
  }
  var fbp = readCookie2('_fbp');

  var gaCookie = readCookie2('_ga');
  var gaClientId = '';
  if (gaCookie) {
    var gaParts = gaCookie.split('.');
    if (gaParts.length >= 4) gaClientId = gaParts[2] + '.' + gaParts[3];
  }

  var params = new URLSearchParams(window.location.search);
  var hidden = {};
  ['utm_source','utm_medium','utm_campaign','utm_content','utm_term',
   'fbclid','gclid','msclkid','source'].forEach(function (k) {
    var v = params.get(k);
    if (v) hidden[k] = v;
  });
  if (window.__quizVariant) hidden.quiz_variant = window.__quizVariant;
  if (!hidden.utm_source && !hidden.utm_medium && !hidden.utm_campaign) {
    try {
      var ft = JSON.parse(localStorage.getItem('gb_first_touch') || 'null');
      if (ft) ['utm_source','utm_medium','utm_campaign','utm_content','utm_term','gclid','msclkid','fbclid','landing_page','referrer'].forEach(function(k) {
        if (ft[k] && !hidden[k]) hidden[k] = ft[k];
      });
    } catch(e) {}
  }

  try {
    var gbAttrRaw = readCookie2('gb_attr');
    if (gbAttrRaw) {
      var gbAttr = JSON.parse(gbAttrRaw);
      if (gbAttr.origin_referrer && !hidden.origin_referrer) hidden.origin_referrer = gbAttr.origin_referrer;
      ['utm_source','utm_medium','utm_campaign','utm_content','utm_term','gclid','msclkid','fbclid'].forEach(function(k){
        if (gbAttr[k] && !hidden[k]) hidden[k] = gbAttr[k];
      });
      var journey = Array.isArray(gbAttr.journey) ? gbAttr.journey.slice() : [];
      journey.push({ u: window.location.pathname, t: Date.now(), d: 'quiz' });
      journey.forEach(function(j){ if (!j.d) j.d = 'gb'; });
      hidden.page_journey = JSON.stringify(journey);
      hidden.page_journey_text = journey.map(function(j){ return j.u; }).join(' → ');
    }
  } catch(e) {}
  // Greg 2026-11-20 (Q9): do not invent source=referral|direct. Copy UTMs when
  // present; otherwise leave source unset so Typeform/Slack cannot label from it.
  if (!hidden.source && hidden.utm_source) {
    hidden.source = hidden.utm_source + (hidden.utm_medium ? '/' + hidden.utm_medium : '');
  }
  hidden.gb_uid = gb_uid;
  if (fbp) hidden.fbp = fbp;
  if (gaClientId) hidden.ga_client_id = gaClientId;
  hidden.landing_page = window.location.origin + window.location.pathname;
  if (document.referrer) hidden.referrer = document.referrer;

  function sourceFromHidden(h) {
    try {
      if (h.gclid) return { channel: 'google', provenance: 'click_id' };
      if (h.msclkid) return { channel: 'bing', provenance: 'click_id' };
      if (h.fbclid) return { channel: 'meta', provenance: 'click_id' };
      var raw = (h.utm_source && String(h.utm_source).trim()) || '';
      var lower = raw.toLowerCase();
      if (!raw || lower === 'not set' || lower === 'not_set' || lower === '(not set)') {
        return { channel: 'organic', provenance: 'none' };
      }
      var map = {
        google: 'google', adwords: 'google', googleads: 'google', google_ads: 'google',
        bing: 'bing', microsoft: 'bing', msads: 'bing', microsoft_ads: 'bing',
        facebook: 'meta', fb: 'meta', meta: 'meta', instagram: 'meta', ig: 'meta',
        linkedin: 'linkedin',
        cold_email: 'cold_email', instantly: 'cold_email',
        drip: 'drip', sendy: 'drip',
        bdr_call: 'bdr_call', kixie: 'bdr_call'
      };
      return { channel: map[lower] || 'unknown', provenance: 'utm' };
    } catch (e) {
      return { channel: 'unknown', provenance: 'none' };
    }
  }
  function readQuizClick() {
    try {
      var raw = localStorage.getItem('quiz_click');
      if (!raw) return null;
      var o = JSON.parse(raw);
      if (!o || typeof o.k !== 'string' || typeof o.v !== 'string') return null;
      var t = o.t;
      if (typeof t !== 'number' || !Number.isInteger(t)) return null;
      if (t < Date.UTC(2020, 0, 1) || t > Date.now() + 86400000) return null;
      return o;
    } catch (e) { return null; }
  }
  var clickKey = hidden.gclid ? 'gclid' : (hidden.msclkid ? 'msclkid' : (hidden.fbclid ? 'fbclid' : ''));
  if (clickKey) {
    var clickVal = hidden[clickKey];
    var stored = readQuizClick();
    var fromUrl = params.get(clickKey) === clickVal;
    if (fromUrl) {
      if (stored && stored.k === clickKey && stored.v === clickVal) {
        hidden.click_at = String(stored.t);
      } else {
        var clickNow = Date.now();
        hidden.click_at = String(clickNow);
        try {
          localStorage.setItem('quiz_click', JSON.stringify({ k: clickKey, v: clickVal, t: clickNow }));
        } catch (e) {}
      }
    } else if (stored && stored.k === clickKey && stored.v === clickVal) {
      hidden.click_at = String(stored.t);
    }
  }
  var srcDecided = sourceFromHidden(hidden);
  hidden.source_channel = srcDecided.channel;
  hidden.source_provenance = srcDecided.provenance;

  function applyHidden() {
    var widgets = document.querySelectorAll('[data-tf-widget]');
    Object.keys(hidden).forEach(function (k) {
      if (typeof hidden[k] === 'object' && hidden[k] !== null) {
        hidden[k] = JSON.stringify(hidden[k]);
      }
    });
    var s = Object.keys(hidden).map(function (k) {
      return k + '=' + encodeURIComponent(hidden[k]);
    }).join(',');
    widgets.forEach(function (w) { w.setAttribute('data-tf-hidden', s); });
  }
  applyHidden();

  function retryGa() {
    if (hidden.ga_client_id) return;
    var m = document.cookie.match('(^|;)\\s*_ga=([^;]+)');
    if (m) {
      var gp = decodeURIComponent(m[2]).split('.');
      if (gp.length >= 4) {
        hidden.ga_client_id = gp[2] + '.' + gp[3];
        applyHidden();
      }
    }
  }
  setTimeout(retryGa, 1500);
  setTimeout(retryGa, 3500);

  window.__gbAttribution = function() { return { gb_uid: gb_uid, hidden: hidden }; };
})();
</script>

<!-- Quiz progress telemetry (Greg, 2026-08-14): which question do people
     abandon at, per campaign? The embed SDK fires the data-tf-on-* callbacks
     declared on the widget div (free, part of embed.js — no paid Typeform
     feature). Each event beacons one row to the quiz-progress Supabase edge
     function; analysis = last question_ref seen per visit with no submit row.
     Handlers MUST be defined before embed.js loads. Never breaks the quiz. -->
<script>
(function () {
  try {
    var EP = 'https://nhdethynnmgrqlswqiqj.supabase.co/functions/v1/quiz-progress';
    var vid = 'q' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
    var seq = 0;
    var attr = { utm_source: '', utm_campaign: '', utm_term: '',
      gclid: '', msclkid: '', fbclid: '', click_at: '', source_channel: '', source_provenance: '' };
    var ua_bucket = /FBAN|FBAV|FB_IAB|FB4A|Instagram/i.test(navigator.userAgent || '') ? 'facebook' : 'other';
    try {
      var h = (window.__gbAttribution && window.__gbAttribution().hidden) || {};
      attr.utm_source = h.utm_source || '';
      attr.utm_campaign = h.utm_campaign || '';
      attr.utm_term = h.utm_term || '';
      attr.gclid = h.gclid || '';
      attr.msclkid = h.msclkid || '';
      attr.fbclid = h.fbclid || '';
      if (h.click_at) attr.click_at = new Date(Number(h.click_at)).toISOString();
      attr.source_channel = h.source_channel || '';
      attr.source_provenance = h.source_provenance || '';
    } catch (e) {}
    function beacon(event, formId, ref) {
      try {
        seq += 1;
        var payload = JSON.stringify({
          visit_id: vid, brand: 'gb', form_id: formId || '', event: event,
          ref: ref || '', seq: seq,
          utm_source: attr.utm_source, utm_campaign: attr.utm_campaign,
          utm_term: attr.utm_term,
          variant: window.__quizVariant || '', slot: 'main', ua_bucket: ua_bucket,
          gclid: attr.gclid, msclkid: attr.msclkid, fbclid: attr.fbclid,
          click_at: attr.click_at, source_channel: attr.source_channel,
          source_provenance: attr.source_provenance
        });
        if (navigator.sendBeacon) {
          navigator.sendBeacon(EP, new Blob([payload], { type: 'text/plain' }));
        }
      } catch (e) {}
    }
    window.tfQuizReady = function (p) { beacon('ready', p && p.formId); pinFooter(); };
    window.tfQuizQuestion = function (p) {
      beacon('question', p && p.formId, p && p.ref);
      try {
        var first = { sTbsRn: '38969d2818d6e750', uVP2g9QP: '01GV66FJERY2T6WMPAN9DFWW03' };
        var ref = (p && p.ref) || '';
        var fid = (p && p.formId) || '';
        if (ref && first[fid] && ref !== first[fid]) popQuiz();
      } catch (e) {}
      pinFooter();
    };
    window.tfQuizSubmit = function (p) { beacon('submit', p && p.formId); };
    window.tfQuizHeight = function (p) {
      if (document.documentElement.classList.contains('quiz-pop')) return;
      try {
        var wrap = document.querySelector('.quiz-card [data-tf-widget]');
        var h = p && p.height;
        if (wrap && h) {
          wrap.style.height = Math.ceil(h) + 'px';
          var iframe = wrap.querySelector('iframe');
          if (iframe) iframe.style.height = Math.ceil(h) + 'px';
        }
      } catch (e) {}
      pinFooter();
    };
    function popQuiz() {
      var card = document.querySelector('.quiz-card');
      if (!card || document.documentElement.classList.contains('quiz-pop')) return;
      var ph = document.createElement('div');
      ph.setAttribute('aria-hidden', 'true');
      ph.style.height = card.offsetHeight + 'px';
      card.parentNode.insertBefore(ph, card);
      document.documentElement.classList.add('quiz-pop');
    }
    function pinFooter() {
      try {
        var f = document.querySelector('.page-footer');
        if (!f) return;
        document.documentElement.style.height = 'auto';
        document.body.style.height = 'auto';
        document.body.style.marginBottom = '0';
        var extra = document.documentElement.scrollHeight - (f.getBoundingClientRect().bottom + window.pageYOffset);
        if (extra > 4 && extra < 600) document.body.style.marginBottom = (-Math.round(extra)) + 'px';
      } catch (e) {}
    }
    setTimeout(pinFooter, 800);
    setTimeout(pinFooter, 2500);
    // D10: widget entered the viewport. ready fires on iframe load even if below fold.
    // querySelector after the pruner: exactly one [data-tf-widget] survives.
    try {
      var el = document.querySelector('[data-tf-widget]');
      var seenFired = false;
      function fireSeen() {
        if (seenFired) return;
        seenFired = true;
        beacon('seen', (el && el.getAttribute('data-tf-widget')) || '');
      }
      if (el && 'IntersectionObserver' in window) {
        var io = new IntersectionObserver(function (entries) {
          for (var i = 0; i < entries.length; i++) {
            if (entries[i].isIntersecting) { fireSeen(); io.disconnect(); break; }
          }
        }, { threshold: 0.01 });
        io.observe(el);
      } else {
        fireSeen();
      }
    } catch (e) {}
  } catch (e) { /* never break the quiz */ }
})();
</script>

<!-- Engagement beacon (telemetry-only; MUST NOT write gb_attr). WP2b. -->
<script>
(function () {
  try {
    var EP = 'https://nhdethynnmgrqlswqiqj.supabase.co/functions/v1/lander-engagement';
    var BRAND = 'gb';
    var vid = 'v' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
    var active = 0, lastAct = Date.now(), maxScroll = 0, words = 0;
    function onAct() { lastAct = Date.now(); }
    ['scroll', 'mousemove', 'keydown', 'touchstart', 'click'].forEach(function (e) {
      window.addEventListener(e, onAct, { passive: true });
    });
    setInterval(function () {
      if (document.visibilityState === 'visible' && Date.now() - lastAct < 60000) {
        active += 5;
        if (active > 1800) active = 1800;
      }
    }, 5000);
    function measure() {
      var d = document.documentElement;
      var h = Math.max(d.scrollHeight, document.body ? document.body.scrollHeight : 0);
      if (h > 0) {
        var pct = Math.round(100 * (window.scrollY + window.innerHeight) / h);
        if (pct > maxScroll) maxScroll = pct > 100 ? 100 : pct;
      }
    }
    window.addEventListener('scroll', measure, { passive: true });
    function send() {
      try {
        measure();
        if (!words && document.body) {
          words = (document.body.innerText || '').split(/\s+/).filter(Boolean).length;
        }
        var p = new URLSearchParams(window.location.search);
        var us = p.get('utm_source') || '', uc = p.get('utm_campaign') || '',
            ut = p.get('utm_term') || '', uct = p.get('utm_content') || '',
            af = (us || uc) ? 'url' : '';
        if (!af) {
          try {
            var cm = document.cookie.match(/(?:^|; )gb_attr=([^;]*)/);
            if (cm) {
              var ck = JSON.parse(decodeURIComponent(cm[1])) || {};
              us = ck.utm_source || ''; uc = ck.utm_campaign || '';
              ut = ck.utm_term || ''; uct = ck.utm_content || '';
              if (us || uc) af = 'cookie';
            }
          } catch (e) {}
        }
        var path = (window.location.pathname || '/').replace(/\/+$/, '') || '/';
        var payload = JSON.stringify({
          visit_id: vid, brand: BRAND, page: path,
          utm_term: ut, utm_content: uct, utm_source: us, utm_campaign: uc, attr_from: af,
          max_scroll_pct: maxScroll, active_seconds: active, word_count: words,
          entry_hash: (window.location.hash || '').slice(0, 40),
          variant: window.__quizVariant || ''
        });
        if (navigator.sendBeacon) {
          navigator.sendBeacon(EP, new Blob([payload], { type: 'text/plain' }));
        }
      } catch (e) {}
    }
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'hidden') send();
    });
    window.addEventListener('pagehide', send);
  } catch (e) { /* never break the page */ }
})();
</script>
