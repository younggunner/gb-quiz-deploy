<div class="tf-wrap">
  <!-- Official Typeform embed SDK widget (converted from raw iframe 2026-08-14,
       mirroring the proven TP quiz pattern). WHY: the SDK fires the
       data-tf-on-* callbacks (question-changed etc.) that feed quiz_progress —
       the raw iframe emitted no events, so per-question abandonment was
       unmeasurable. Hidden fields move from iframe URL params to
       data-tf-hidden (same fields, same relay; TP proves the round-trip). -->
  <div id="tf-gb-widget"
       data-tf-widget="sTbsRn"
       data-tf-opacity="100"
       data-tf-iframe-props="title=GreaseBook Quiz"
       data-tf-transitive-search-params
       data-tf-medium="snippet"
       data-tf-on-ready="tfQuizReady"
       data-tf-on-question-changed="tfQuizQuestion"
       data-tf-on-submit="tfQuizSubmit"
       style="width:100%;height:100%;"></div>

<!-- Attribution script — ported VERBATIM from the live Instapage page (captured 2026-07-13).
     ONE copy only. Do not duplicate (June 2026 incident: a second copy blanked all quiz UTMs). -->
<script>
(function () {
  function uuidv4() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, function(c){
      return (c ^ (crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c/4)).toString(16);
    });
  }
  var gb_uid;
  try {
    gb_uid = localStorage.getItem('gb_uid');
    if (!gb_uid) { gb_uid = uuidv4(); localStorage.setItem('gb_uid', gb_uid); }
  } catch (e) { gb_uid = uuidv4(); }

  function readCookie(name) {
    var m = document.cookie.match('(^|;)\\s*' + name + '=([^;]+)');
    return m ? decodeURIComponent(m[2]) : '';
  }
  var fbp = readCookie('_fbp');

  // Extract real GA4 client_id from _ga cookie (format: GA1.1.XXXXXXXXX.XXXXXXXXX)
  var gaCookie = readCookie('_ga');
  var gaClientId = '';
  if (gaCookie) {
    var gaParts = gaCookie.split('.');
    if (gaParts.length >= 4) gaClientId = gaParts[2] + '.' + gaParts[3];
  }

  var params = new URLSearchParams(window.location.search);
  var hidden = {};
  ['utm_source','utm_medium','utm_campaign','utm_content','utm_term',
   'fbclid','gclid','msclkid','source'].forEach(function (k) {
    var v = params.get(k);
    if (v) hidden[k] = v;
  });
  // Fallback: first-touch UTMs persisted from an earlier site visit (e.g. Capterra → homepage → quiz)
  if (!hidden.utm_source && !hidden.utm_medium && !hidden.utm_campaign) {
    try {
      var ft = JSON.parse(localStorage.getItem('gb_first_touch') || 'null');
      if (ft) ['utm_source','utm_medium','utm_campaign','utm_content','utm_term','gclid','msclkid','fbclid','landing_page','referrer'].forEach(function(k) {
        if (ft[k] && !hidden[k]) hidden[k] = ft[k];
      });
    } catch(e) {}
  }

  // Cross-domain attribution from greasebook.com gb-attr.js (cookie set on .greasebook.com)
  try {
    var gbAttrRaw = readCookie('gb_attr');
    if (gbAttrRaw) {
      var gbAttr = JSON.parse(gbAttrRaw);
      if (gbAttr.origin_referrer && !hidden.origin_referrer) hidden.origin_referrer = gbAttr.origin_referrer;
      // Pull UTMs from cookie when URL didn't have any (organic → /quiz directly)
      ['utm_source','utm_medium','utm_campaign','utm_content','utm_term','gclid','msclkid','fbclid'].forEach(function(k){
        if (gbAttr[k] && !hidden[k]) hidden[k] = gbAttr[k];
      });
      // Build page_journey: greasebook.com hops (from cookie) + current quiz pageview
      var journey = Array.isArray(gbAttr.journey) ? gbAttr.journey.slice() : [];
      journey.push({ u: window.location.pathname, t: Date.now(), d: 'quiz' });
      // Mark non-quiz entries with domain hint for the dashboard renderer
      journey.forEach(function(j){ if (!j.d) j.d = 'gb'; });
      hidden.page_journey = JSON.stringify(journey);
      // Readable mirror of page_journey — lets Slack/Make show a plain path
      // string without parsing JSON, since Make has no JSON-array formula function.
      hidden.page_journey_text = journey.map(function(j){ return j.u; }).join(' → ');
    }
  } catch(e) {}
  // Nothing downstream reads this field's value server-side (typeform-ga4-relay
  // classifies off utm_source, not hidden.source) — it only surfaces raw in the
  // Zapier Slack lead notification, so give it a real label instead of the
  // Instapage-era placeholder that survived the July 2026 GitHub Pages port verbatim.
  if (!hidden.source) {
    hidden.source = hidden.utm_source
      ? hidden.utm_source + (hidden.utm_medium ? '/' + hidden.utm_medium : '')
      : (document.referrer ? 'referral' : 'direct');
  }
  hidden.gb_uid = gb_uid;
  if (fbp) hidden.fbp = fbp;
  if (gaClientId) hidden.ga_client_id = gaClientId;

  // Capture landing page and referrer for cross-page attribution
  hidden.landing_page = window.location.origin + window.location.pathname;
  if (document.referrer) hidden.referrer = document.referrer;

  // Write hidden fields onto the widget div as data-tf-hidden (SDK pattern,
  // 2026-08-14 — replaces the old iframe URL-param build). Mirror of the TP
  // quiz's applyHidden: any non-string value gets JSON.stringify'd, then every
  // value is encodeURIComponent'd. Typeform's data-tf-hidden parser splits on
  // ',' then '=' and does NOT decode — the edge function (typeform-ga4-relay)
  // safe-decodes on intake, so encoding here is what survives the round-trip.
  function applyHidden() {
    var w = document.getElementById('tf-gb-widget');
    if (!w) return;
    Object.keys(hidden).forEach(function (k) {
      if (typeof hidden[k] === 'object' && hidden[k] !== null) {
        hidden[k] = JSON.stringify(hidden[k]);
      }
    });
    var s = Object.keys(hidden).map(function (k) {
      return k + '=' + encodeURIComponent(hidden[k]);
    }).join(',');
    w.setAttribute('data-tf-hidden', s);
  }
  applyHidden();

  // Retry GA4 client_id capture — cookie may not be set on first paint.
  // If embed.js already rendered the iframe, a late update may not propagate —
  // accepted tradeoff for fresh visitors (same note as the TP quiz).
  function retryGa() {
    if (hidden.ga_client_id) return;
    var m = document.cookie.match('(^|;)\\s*_ga=([^;]+)');
    if (m) {
      var gp = decodeURIComponent(m[2]).split('.');
      if (gp.length >= 4) {
        hidden.ga_client_id = gp[2] + '.' + gp[3];
        applyHidden();
      }
    }
  }
  setTimeout(retryGa, 1500);
  setTimeout(retryGa, 3500);

  // Debug: browser console → __gbAttribution()
  window.__gbAttribution = function() { return { gb_uid: gb_uid, hidden: hidden }; };
})();
</script>

<!-- Quiz progress telemetry (Greg, 2026-08-14): which question do people
     abandon at, per campaign? The embed SDK fires the data-tf-on-* callbacks
     declared on the widget div (free, part of embed.js — no paid Typeform
     feature). Each event beacons one row to the quiz-progress Supabase edge
     function; analysis = last question_ref seen per visit with no submit row.
     Handlers MUST be defined before embed.js loads. Never breaks the quiz. -->
<script>
(function () {
  try {
    var EP = 'https://nhdethynnmgrqlswqiqj.supabase.co/functions/v1/quiz-progress';
    var vid = 'q' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
    var seq = 0;
    var attr = { utm_source: '', utm_campaign: '', utm_term: '' };
    var ua_bucket = /FBAN|FBAV|FB_IAB|FB4A|Instagram/i.test(navigator.userAgent || '') ? 'facebook' : 'other';
    try {
      var h = (window.__gbAttribution && window.__gbAttribution().hidden) || {};
      attr.utm_source = h.utm_source || '';
      attr.utm_campaign = h.utm_campaign || '';
      attr.utm_term = h.utm_term || '';
    } catch (e) {}
    function beacon(event, formId, ref) {
      try {
        seq += 1;
        var payload = JSON.stringify({
          visit_id: vid, brand: 'gb', form_id: formId || '', event: event,
          ref: ref || '', seq: seq,
          utm_source: attr.utm_source, utm_campaign: attr.utm_campaign,
          utm_term: attr.utm_term,
          variant: '', slot: 'main', ua_bucket: ua_bucket
        });
        if (navigator.sendBeacon) {
          navigator.sendBeacon(EP, new Blob([payload], { type: 'text/plain' }));
        }
      } catch (e) {}
    }
    window.tfQuizReady = function (p) { beacon('ready', p && p.formId); };
    window.tfQuizQuestion = function (p) { beacon('question', p && p.formId, p && p.ref); };
    window.tfQuizSubmit = function (p) { beacon('submit', p && p.formId); };
    // D10: widget entered the viewport. ready fires on iframe load even if below fold.
    try {
      var el = document.getElementById('tf-gb-widget');
      var seenFired = false;
      function fireSeen() {
        if (seenFired) return;
        seenFired = true;
        beacon('seen', (el && el.getAttribute('data-tf-widget')) || '');
      }
      if (el && 'IntersectionObserver' in window) {
        var io = new IntersectionObserver(function (entries) {
          for (var i = 0; i < entries.length; i++) {
            if (entries[i].isIntersecting) { fireSeen(); io.disconnect(); break; }
          }
        }, { threshold: 0.01 });
        io.observe(el);
      } else {
        fireSeen();
      }
    } catch (e) {}
  } catch (e) { /* never break the quiz */ }
})();
</script>

<!-- Engagement beacon (telemetry-only; MUST NOT write gb_attr). WP2b. -->
<script>
(function () {
  try {
    var EP = 'https://nhdethynnmgrqlswqiqj.supabase.co/functions/v1/lander-engagement';
    var BRAND = 'gb';
    var vid = 'v' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
    var active = 0, lastAct = Date.now(), maxScroll = 0, words = 0;
    function onAct() { lastAct = Date.now(); }
    ['scroll', 'mousemove', 'keydown', 'touchstart', 'click'].forEach(function (e) {
      window.addEventListener(e, onAct, { passive: true });
    });
    setInterval(function () {
      if (document.visibilityState === 'visible' && Date.now() - lastAct < 60000) {
        active += 5;
        if (active > 1800) active = 1800;
      }
    }, 5000);
    function measure() {
      var d = document.documentElement;
      var h = Math.max(d.scrollHeight, document.body ? document.body.scrollHeight : 0);
      if (h > 0) {
        var pct = Math.round(100 * (window.scrollY + window.innerHeight) / h);
        if (pct > maxScroll) maxScroll = pct > 100 ? 100 : pct;
      }
    }
    window.addEventListener('scroll', measure, { passive: true });
    function send() {
      try {
        measure();
        if (!words && document.body) {
          words = (document.body.innerText || '').split(/\s+/).filter(Boolean).length;
        }
        var p = new URLSearchParams(window.location.search);
        var us = p.get('utm_source') || '', uc = p.get('utm_campaign') || '',
            ut = p.get('utm_term') || '', uct = p.get('utm_content') || '',
            af = (us || uc) ? 'url' : '';
        if (!af) {
          try {
            var cm = document.cookie.match(/(?:^|; )gb_attr=([^;]*)/);
            if (cm) {
              var ck = JSON.parse(decodeURIComponent(cm[1])) || {};
              us = ck.utm_source || ''; uc = ck.utm_campaign || '';
              ut = ck.utm_term || ''; uct = ck.utm_content || '';
              if (us || uc) af = 'cookie';
            }
          } catch (e) {}
        }
        var path = (window.location.pathname || '/').replace(/\/+$/, '') || '/';
        var payload = JSON.stringify({
          visit_id: vid, brand: BRAND, page: path,
          utm_term: ut, utm_content: uct, utm_source: us, utm_campaign: uc, attr_from: af,
          max_scroll_pct: maxScroll, active_seconds: active, word_count: words,
          entry_hash: (window.location.hash || '').slice(0, 40),
          variant: ''
        });
        if (navigator.sendBeacon) {
          navigator.sendBeacon(EP, new Blob([payload], { type: 'text/plain' }));
        }
      } catch (e) {}
    }
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'hidden') send();
    });
    window.addEventListener('pagehide', send);
  } catch (e) { /* never break the page */ }
})();
</script>
